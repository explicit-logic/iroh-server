# SwiftLint configuration. Paths are relative to this file, which sits at the
# repo root; the build phase in app/project.yml cds here before running so the
# command line and Xcode see exactly the same rules.
#
# Run by hand:   swiftlint            (from the repo root)
# Autocorrect:   swiftlint --fix
# Rule catalog:  swiftlint rules

included:
  - app/Sources
  - app/Tests

excluded:
  # Generated by XcodeGen — see BUILD.md. Never linted, never edited.
  - app/IrohServer.xcodeproj
  - server/target

# Rules SwiftLint ships disabled. These are the ones worth the noise here.
opt_in_rules:
  - explicit_init                  # Foo.init(x) -> Foo(x)
  - first_where                    # .filter { }.first -> .first(where:)
  - force_unwrapping               # a crash in a menu-bar app is a silent quit
  - last_where
  - empty_count                    # .count == 0 -> .isEmpty
  - redundant_nil_coalescing
  - toggle_bool
  - unneeded_parentheses_in_closure_argument
  - sorted_first_last
  - contains_over_first_not_nil
  - joined_default_parameter
  - literal_expression_end_indentation
  - operator_usage_whitespace
  - closure_spacing
  - vertical_parameter_alignment_on_call
  - multiline_parameters

# Rules SwiftLint ships enabled that do not earn their keep here.
disabled_rules:
  - todo                           # the spec's deferred-work markers are TODOs

line_length:
  warning: 100
  error: 140
  ignores_comments: false          # the prose comments here are the docs
  ignores_urls: true

identifier_name:
  min_length:
    warning: 2
  excluded:
    - id                           # WindowID.main, openWindow(id:)

type_name:
  min_length: 3

# SwiftUI view bodies and Scene bodies are declarative; the default 50-line
# body limit fires on legitimate layout code long before it signals a problem.
function_body_length:
  warning: 60
  error: 120

custom_rules:
  no_print:
    name: "print() in app code"
    regex: '(^|[^\w.])print\('
    match_kinds:
      - identifier
    message: "Use os.Logger, not print() — stdout is not captured for a bundled app."
    severity: warning
